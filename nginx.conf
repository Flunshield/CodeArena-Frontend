worker_processes 1;

events {
    worker_connections 1024;
}

http {
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        application/octet-stream              bin exe dll;
        text/plain                            txt;
        image/svg+xml                         svg;   # Ajout du type MIME pour les fichiers SVG
    }

    server {
        listen 3443;
        server_name codearena.jbertrand.fr;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;
        }
    }
}
